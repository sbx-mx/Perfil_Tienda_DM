name: Eliminar archivos legados autorizados

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-obsolete.yml"
      - "data.js"
      - "Store_Master_Audit.csv"
      - "README.txt"
      - "manifest.json"
      - "apple-touch-icon.png"
      - "icon-192.png"
      - "icon-512.png"
      - "icon.svg"
      - "style.css"
      - "data/engines/Base_Mix.csv"
  workflow_dispatch:
  workflow_run:
    workflows: ["Validar y publicar Perfil de Tienda"]
    types: [completed]

concurrency:
  group: perfil-tienda-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Auditar alcance autorizado
        run: |
          python scripts/cleanup_obsolete.py
          python scripts/cleanup_obsolete.py --print-candidates

      - name: Validar que el sitio no use archivos legados
        run: |
          ! grep -R --line-number --fixed-strings 'data.js' index.html app.js sw.js manifest.webmanifest
          ! grep -R --line-number --fixed-strings 'style.css' index.html app.js sw.js manifest.webmanifest
          ! grep -R --line-number --fixed-strings 'Store_Master_Audit.csv' index.html app.js sw.js manifest.webmanifest

      - name: Eliminar sólo rutas autorizadas
        run: python scripts/cleanup_obsolete.py --apply --check-clean

      - name: Confirmar raíz limpia
        run: |
          while IFS= read -r obsolete; do
            test ! -e "$obsolete" || {
              echo "Persistió archivo obsoleto: $obsolete"
              exit 1
            }
          done < <(python scripts/cleanup_obsolete.py --print-candidates)

      - name: Registrar limpieza
        run: |
          if git diff --quiet; then
            echo "No hay archivos legados presentes"
            exit 0
          fi
          mapfile -t obsolete < <(git diff --name-only --diff-filter=D)
          if [ "${#obsolete[@]}" -eq 0 ]; then
            echo "No hay eliminaciones que registrar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- "${obsolete[@]}"
          git commit -m "chore: eliminar archivos legados autorizados"
          git push
