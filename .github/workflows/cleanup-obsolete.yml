name: Eliminar archivos legados autorizados

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: Escribe ELIMINAR para aplicar; otro valor sólo audita
        required: false
        default: AUDITAR

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Auditar alcance
        run: python scripts/cleanup_obsolete.py

      - name: Eliminar sólo rutas autorizadas
        if: ${{ inputs.confirm_delete == 'ELIMINAR' }}
        run: python scripts/cleanup_obsolete.py --apply --check-clean

      - name: Registrar limpieza
        if: ${{ inputs.confirm_delete == 'ELIMINAR' }}
        run: |
          if git diff --quiet; then
            echo "No hay archivos legados presentes"
            exit 0
          fi
          python scripts/cleanup_obsolete.py --print-candidates > .cleanup-candidates.txt
          mapfile -t obsolete < .cleanup-candidates.txt
          rm .cleanup-candidates.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- "${obsolete[@]}"
          git commit -m "chore: eliminar archivos legados autorizados"
          git push
