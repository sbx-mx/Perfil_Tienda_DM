name: Validar y publicar Perfil de Tienda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: perfil-tienda-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar validador
        run: python -m pip install --requirement requirements-validation.txt

      - name: Validar límite de archivos
        run: python scripts/check_file_sizes.py

      - name: Auditar motores y construir contrato
        run: python scripts/build_data.py

      - name: Ejecutar pruebas funcionales
        run: python -m unittest discover -s tests -v

      - name: Preparar sitio mínimo
        run: python scripts/stage_site.py --output dist

      - name: Validar artefacto
        run: |
          test -f dist/index.html
          test -f dist/data/dashboard.json
          test -f dist/data/audit.json
          test -f dist/.nojekyll
          test ! -d dist/data/engines

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
