<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#006241" />
  <meta name="description" content="Perfil de tienda con comparativos mensuales, mix de venta y resumen de partners." />
  <title>Perfil de Tienda</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="operational.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Inicio Perfil de Tienda">
      <img src="assets/icon.svg" alt="" width="42" height="42" />
      <span><small>STARBUCKS MÉXICO</small><strong>Perfil de Tienda</strong></span>
    </a>
    <div class="source-status" id="sourceStatus" aria-live="polite"><i></i><span>Cargando motores…</span></div>
  </header>

  <main class="page-shell">
    <section class="control-panel" aria-label="Filtros del perfil">
      <div class="scope-tabs" role="group" aria-label="Nivel de análisis">
        <button type="button" data-scope="store" class="active">Tienda</button>
        <button type="button" data-scope="dm">DM</button>
        <button type="button" data-scope="region">Región</button>
      </div>
      <div class="field field-search">
        <label id="profileLabel" for="profileSearch">Tienda</label>
        <input id="profileSearch" autocomplete="off" placeholder="Busca por CeCo o tienda" role="combobox" aria-controls="profileOptions" aria-expanded="false" />
        <div class="profile-dropdown" id="profileOptions" role="listbox" hidden></div>
      </div>
    </section>

    <section class="profile-hero skeleton" id="profileHero" aria-live="polite"></section>

    <section class="operational-strip" id="operationalStrip" aria-label="Resumen operativo"></section>

    <nav class="pillar-tabs anchor-section" id="indicadores" aria-label="Pilares">
      <button type="button" data-pillar="Partner" class="active">Partner</button>
      <button type="button" data-pillar="Cliente">Cliente</button>
      <button type="button" data-pillar="Negocio">Negocio</button>
    </nav>

    <section class="section-heading">
      <div><span class="eyebrow" id="pillarEyebrow">INDICADORES</span><h2 id="pillarTitle">Partner</h2><p id="pillarDescription">Personas, productividad y eficiencia de la tienda.</p></div>
      <div class="chart-mode" role="group" aria-label="Vista de gráficas">
        <button type="button" data-chart-mode="trend" class="active">Tendencia</button>
        <button type="button" data-chart-mode="variance">Brecha</button>
      </div>
    </section>
    <section class="metric-grid" id="metricGrid"></section>

    <section class="insight-grid" id="perfil-operativo">
      <article class="panel" id="partnerPanel"></article>
      <article class="panel" id="mixPanel"></article>
    </section>
  </main>

  <noscript>Este dashboard requiere JavaScript para procesar los motores.</noscript>
  <script src="app.js" defer></script>
</body>
</html>
